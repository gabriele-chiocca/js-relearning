<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="exercise.js" defer></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-dark">
    <div class="row">
      <div class="col-12 box my-5">
        <div class="bg-primary p-5 rounded">
          <form id="loginForm" action="" class="bg-white p-4 rounded">
            <div class="form-group mb-3">
              <label class="from-label mb-2 h4" for="email">TO DO LIST</label>
              <input
                type="todo"
                name="todo"
                id="input"
                placeholder="Inserisci il tuo to do"
                class="form-control"
                required
              />
            </div>

            <button
              id="btnclassic"
              type="submit"
              class="btn btn-primary"
              onclick=""
            >
              Invia
            </button>
          </form>
          <p id="messaggio"></p>
        </div>
      </div>
      <div class="col-12 box" id="boxrisposte">
        <!-- Lista dove inserire i todo -->
        <ul>
          <li>
            <div class="bg-white p-3 answer-bar d-flex rounded">
              <p>${answer}</p>

              <div>
                <i class="bi bi-check-circle"></i>
                <i class="bi bi-x-circle"></i>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
